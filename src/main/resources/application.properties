spring.application.name=task-tracker-backend
server.port=8081

# PostgreSQL
spring.datasource.url=${TASKTRACKER_DB_URL:jdbc:postgresql://127.0.0.1:5432/task_tracker}
spring.datasource.username=${TASKTRACKER_DB_USER:}
spring.datasource.password=${TASKTRACKER_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${TASKTRACKER_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Seed data solo cuando la tabla est? vac?a
spring.sql.init.mode=never

# Configuración de Logging
logging.level.root=INFO
logging.level.com.tasktracker=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
# Evidencias de incidentes: máximo 10 MB por archivo
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Acceso de un unico propietario. Usuario y hash BCrypt se entregan por entorno (ver README).
tasktracker.auth.username=${TASKTRACKER_USER:}
tasktracker.auth.password-hash=${TASKTRACKER_PASSWORD_HASH:}
server.address=127.0.0.1
server.servlet.session.cookie.name=TASKTRACKER_SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${TASKTRACKER_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h
