spring.application.name=task-tracker-backend
server.port=8081

# PostgreSQL
spring.datasource.url=${TASKTRACKER_DB_URL:jdbc:postgresql://127.0.0.1:5432/task_tracker}
spring.datasource.username=${TASKTRACKER_DB_USER:}
spring.datasource.password=${TASKTRACKER_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Seed data solo cuando la tabla est? vac?a
spring.sql.init.mode=never

# Configuración de Logging
logging.level.root=INFO
logging.level.com.tasktracker=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
# Evidencias de incidentes: máximo 10 MB por archivo
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# KOVA is the only application identity provider. No local login fallback.
spring.profiles.default=kova-personal
