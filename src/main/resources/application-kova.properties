# Isolated pilot instance. Never point this profile at the existing TaskTracker database.
server.address=127.0.0.1
server.port=14210
server.servlet.context-path=/tasktracker-prueba
server.servlet.session.cookie.name=TASKTRACKER_KOVA_SESSION
server.servlet.session.cookie.path=/tasktracker-prueba
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=20m
spring.datasource.url=jdbc:postgresql://127.0.0.1:15492/tasktracker_pilot
spring.datasource.username=tasktracker_pilot
spring.datasource.password=${TASKTRACKER_PILOT_DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
logging.level.com.tasktracker=INFO
tasktracker.kova.ui-uri=https://7yrak-server.tail390d34.ts.net/tasktracker-prueba/
tasktracker.kova.check-uri=http://127.0.0.1:14200/kova/api/v1/sso/access
spring.security.oauth2.client.registration.kova.client-id=tasktracker-pilot
spring.security.oauth2.client.registration.kova.client-authentication-method=none
spring.security.oauth2.client.registration.kova.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kova.scope=openid,profile
spring.security.oauth2.client.registration.kova.redirect-uri=https://7yrak-server.tail390d34.ts.net/tasktracker-prueba/login/oauth2/code/kova
spring.security.oauth2.client.provider.kova.authorization-uri=https://7yrak-server.tail390d34.ts.net/kova/oauth2/authorize
spring.security.oauth2.client.provider.kova.token-uri=http://127.0.0.1:14200/kova/oauth2/token
spring.security.oauth2.client.provider.kova.jwk-set-uri=http://127.0.0.1:14200/kova/oauth2/jwks
spring.security.oauth2.client.provider.kova.user-name-attribute=sub
spring.security.oauth2.client.provider.kova.issuer-uri=https://7yrak-server.tail390d34.ts.net/kova
